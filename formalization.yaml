  arxiv: ["math.HO", "math.CO", "math.RA", "math.MG", "math.CA"]
  # 97 mathematics education; 15A linear algebra; 20 group theory; 12F field extensions; 11J81 transcendence;
  # 05 combinatorics; 33F10 symbolic computation of special functions; 26 real functions; 65D32 quadrature;
  # 51 geometry; 03B35 mechanization of proofs.
  msc2020: ["97-01", "15A21", "12F10", "11J81", "05A15", "05C15", "06A07", "33F10", "40A05", "65D32", "51M04", "51A20", "03B35"]

