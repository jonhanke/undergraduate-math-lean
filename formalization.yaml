related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: "Built on Mathlib at commit 1b1ccf4. The headline verdicts compare with Mathlib master (df6966d, 2026-11-07); each book map names the Mathlib declaration of every item Mathlib has, and a course-layer theorem of this library states it in the book's terms."
  - id: "https://github.com/TauCetiProject/TauCeti"
    relationship: "related"
    note: >-
      Not a dependency, and no code is ported from it. Headlines are only results Tau Ceti main (d2083f0f) does not
      have; results proved here that Tau Ceti also proves (for example the singular value decomposition, the
      Schwarz-Pick lemma, Green's theorem, the area of a hyperbolic triangle) are not headlines. Tau Ceti proves the
      Lindemann-Weierstrass theorem, which implies the transcendence of pi, but does not state that corollary.

status:
  scope: >-
    Formalized (the 29 statements of the Challenge_<Topic>.lean files, proved in the
    Solution_<Topic>.lean files), and every item of the nine books classified in the book maps: proved here, in
    Mathlib, partly in Mathlib, not formalized, or not a result. No headline depends on an unproved input.
  sorry_count: 0
  sorry_in_definitions: 0
  # No custom axioms; the standard axioms used (checked by scripts/check_axioms/ and lake comparator):
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code orchestrating parallel agents, each in its own git branch, with Lean kernel builds (lake build)
        as the check and pull requests merged into the main branch; human direction throughout.
      prompting_notes: >-
        Human-chosen books; agents classified every numbered item of each book against Mathlib, then proved the
        missing results topic by topic, with written notes passed between sessions. A kernel-level audit decides
        what is proved.
  notes: >-
    Jonathan Hanke designed and directed the project; the Lean code was written by Claude Opus 5.5 and Claude
    Sonnet 5.5 in November 2026. All proofs are checked by the Lean kernel; the headline statements are collected
    in the Challenge_<Topic>.lean files for human review.

fidelity:
  divergences: >-
    (1) Geometry is formalized in concrete models (the Euclidean plane as R^2, the real projective plane from R^3,
    the Poincare disc), not from Petrunin's axioms of a neutral plane; the neutral-plane axioms are stated and
    checked in the Euclidean and hyperbolic models, but no theorem is derived from them. (2) The algorithms of A=B
    are formalized as mathematical decision and correctness theorems (their outputs are chosen classically), not
    as executable programs; Zeilberger's algorithm and the WZ method are formalized as the soundness of supplied
    certificates only. (3) Calculus and trigonometry are mostly techniques and worked examples: their reusable facts
    are rows of the maps, and most theory is Mathlib's. (4) The book maps' one-line statements are our paraphrases,
    not the books' wording; the Lean statement is the authority.

review:
  status: "not yet reviewed: the 29 headline statements of the Challenge_<Topic>.lean files and the definitions they use have not yet been reviewed by a human"
  reviewers: []
  notes: >-
    The headline statements and the definitions they use have not yet been reviewed by a human; that review is
    planned. The rest of the library (its other definitions and results, and the book maps) has not been reviewed
    by a human, and there has been no external review. Lean checks the proofs; lake comparator checks, one topic at
    a time, that each Solution_<Topic>.lean proves exactly the Challenge_<Topic>.lean statements using only the
    standard axioms.

