version: "v0.4"

project:
  name: "undergraduate-math-lean (UndergradKB): undergraduate mathematics"
  description: >-
    A Lean 4 + Mathlib formalization of eighteen openly available undergraduate textbooks in fourteen topics, item
    by item: linear algebra (Axler, Linear Algebra Done Right, 4th edition; Hefferon, Linear Algebra, 4th edition),
    abstract algebra (Judson and Beezer, Abstract Algebra: Theory and Applications), combinatorics (Keller and
    Trotter, Applied Combinatorics; Petkovsek, Wilf and Zeilberger, A=B), calculus (OpenStax Calculus, Volumes 1 to
    3), trigonometry (Corral, Trigonometry; OpenStax Algebra and Trigonometry), geometry (Petrunin, Euclidean Plane
    and its Relatives), precalculus (Stitz and Zeager), statistics (OpenStax Introductory Statistics), probability
    (Grinstead and Snell), proofs, logic and sets (Hammack, Book of Proof; Levin, Discrete Mathematics), differential
    equations (Lebl, Notes on Diffy Qs), complex analysis (Beck, Marchesi, Pixton and Sabalka), representation
    theory (Etingof et al.) and topology (Morris, Topology Without Tears). Every item of every book is mapped to its
    Lean declaration (in this library or in Mathlib) and its status in docs/books/, and each book has a course
    outline in docs/courses/. Principal results not in Mathlib: the Jordan normal form and its uniqueness; Schur's
    triangularization; the transcendence of pi; the constructible numbers and the three classical impossibilities;
    an explicit quintic not solvable by radicals; the crystallographic restriction; the finite subgroups of O(2);
    the BCH bound; the theorems of Dilworth, Brooks, Cayley (n^(n-2) trees), Gale-Shapley, Gale-Ryser, Euler
    (circuits) and Dirac; the Lovasz local lemma; Gosper's algorithm, Sister Celine's theorem and Petkovsek's
    algorithm Hyper, as decision and correctness theorems; the summation theorems of Gauss, Dougall and Dixon;
    Riemann's rearrangement theorem; the error bound of Simpson's rule; Heron's formula and the law of tangents;
    the Gauss-Wantzel, Wallace-Bolyai-Gerwien and Poncelet-Steiner theorems; Desargues and Pappus; the fundamental
    theorems of affine and projective geometry; the equivalent forms of the parallel axiom in a neutral plane and
    the Saccheri-Legendre theorem; Descartes' rule of signs with parity; the sampling distributions of the t, chi
    square and F tests; convergence of regular and ergodic Markov chains, absorbing chains, Polya's theorem, the arc
    sine law, riffle shuffles and the local limit theorem; Lerch's uniqueness theorem for the Laplace transform, the
    solution space of a linear equation of order n, and the general solution of the wave equation; the
    Casorati-Weierstrass theorem and Dedekind reciprocity; the factorization of the group determinant and
    Dixmier's lemma; the period three theorem, Peano's curve, the Banach-Mazur theorem, closed subgroups of R^n and
    of tori, the Wallman compactification, and Pontryagin duality for R^a x T^b x Z^c.
  authors:
    - "Jonathan Hanke"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jonathan Hanke"

