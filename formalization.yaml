# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "undergraduate-math-lean (UndergradKB): undergraduate mathematics"
  description: >-
    A Lean 4 + Mathlib formalization of nine openly available undergraduate textbooks in six topics, item by item:
    linear algebra (Axler, Linear Algebra Done Right, 4th edition; Hefferon, Linear Algebra, 4th edition), abstract
    algebra (Judson and Beezer, Abstract Algebra: Theory and Applications), combinatorics (Keller and Trotter,
    Applied Combinatorics; Petkovsek, Wilf and Zeilberger, A=B), calculus (OpenStax Calculus, Volumes 1 to 3),
    trigonometry (Corral, Trigonometry; OpenStax Algebra and Trigonometry) and geometry (Petrunin, Euclidean Plane
    and its Relatives). Every item of every book is mapped to its Lean declaration (in this library or in Mathlib)
    and its status in docs/books/, and each book has a course outline in docs/courses/. Principal results not in
    Mathlib: the Jordan normal form and its uniqueness; Schur's triangularization; the transcendence of pi; the
    constructible numbers and the three classical impossibilities; an explicit quintic not solvable by radicals;
    the theorems of Dilworth, Brooks, Cayley (n^(n-2) trees), Gale-Shapley and Gale-Ryser; Gosper's algorithm,
    Sister Celine's theorem and Petkovsek's algorithm Hyper, as decision and correctness theorems; Riemann's
    rearrangement theorem; the error bound of Simpson's rule; Heron's formula and the law of tangents; the
    Gauss-Wantzel theorem, the Wallace-Bolyai-Gerwien theorem, the Poncelet-Steiner theorem, and the theorems of
    Desargues and Pappus in the real projective plane.
  authors:
    - "Jonathan Hanke"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jonathan Hanke"

