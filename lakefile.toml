name = "undergraduate_math_lean"
version = "0.2.1"
defaultTargets = ["Common", "LinearAlgebra", "AbstractAlgebra", "Combinatorics", "Calculus", "Trigonometry",
  "Geometry", "Precalculus", "Statistics", "Probability", "Foundations", "DifferentialEquations", "ComplexAnalysis",
  "RepresentationTheory", "Topology", "RealAnalysis", "Challenge_LinearAlgebra", "Solution_LinearAlgebra",
  "Challenge_AbstractAlgebra", "Solution_AbstractAlgebra", "Challenge_Combinatorics", "Solution_Combinatorics",
  "Challenge_Calculus", "Solution_Calculus", "Challenge_Trigonometry", "Solution_Trigonometry", "Challenge_Geometry",
  "Solution_Geometry", "Challenge_Precalculus", "Solution_Precalculus", "Challenge_Statistics",
  "Solution_Statistics", "Challenge_Probability", "Solution_Probability",
  "Challenge_DifferentialEquations", "Solution_DifferentialEquations",
  "Challenge_ComplexAnalysis", "Solution_ComplexAnalysis", "Challenge_RepresentationTheory",
  "Solution_RepresentationTheory", "Challenge_Topology", "Solution_Topology", "Challenge_Foundations",
  "Solution_Foundations", "Challenge_RealAnalysis", "Solution_RealAnalysis"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

# Mathlib only, prebuilt from its cache. Pinned to the Mathlib commit of Tau Ceti's main branch at 2026-11-07, the
# same commit as elementary-number-theory-lean v0.1.0 and undergraduate-math-lean v0.1.0.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "1b1ccf4b088b32fa3f23f2de1127433254a81e1e"

# One library per topic. A topic imports Mathlib modules and UndergradKB.Common only, never another topic and never
# all of Mathlib, so a change in one topic never rebuilds or rechecks another (scripts/check_modularity.py).
[[lean_lib]]
name = "Common"
roots = ["UndergradKB.Common"]
globs = ["UndergradKB.Common.*"]

[[lean_lib]]
name = "LinearAlgebra"
roots = ["UndergradKB.LinearAlgebra"]
globs = ["UndergradKB.LinearAlgebra.*"]

[[lean_lib]]
name = "AbstractAlgebra"
roots = ["UndergradKB.AbstractAlgebra"]
globs = ["UndergradKB.AbstractAlgebra.*"]

[[lean_lib]]
name = "Combinatorics"
roots = ["UndergradKB.Combinatorics"]
globs = ["UndergradKB.Combinatorics.*"]

[[lean_lib]]
name = "Calculus"
roots = ["UndergradKB.Calculus"]
globs = ["UndergradKB.Calculus.*"]

[[lean_lib]]
name = "Trigonometry"
roots = ["UndergradKB.Trigonometry"]
globs = ["UndergradKB.Trigonometry.*"]

[[lean_lib]]
name = "Geometry"
roots = ["UndergradKB.Geometry"]
globs = ["UndergradKB.Geometry.*"]

[[lean_lib]]
name = "Precalculus"
roots = ["UndergradKB.Precalculus"]
globs = ["UndergradKB.Precalculus.*"]

[[lean_lib]]
name = "Statistics"
roots = ["UndergradKB.Statistics"]
globs = ["UndergradKB.Statistics.*"]

[[lean_lib]]
name = "Probability"
roots = ["UndergradKB.Probability"]
globs = ["UndergradKB.Probability.*"]

[[lean_lib]]
name = "Foundations"
roots = ["UndergradKB.Foundations"]
globs = ["UndergradKB.Foundations.*"]

[[lean_lib]]
name = "DifferentialEquations"
roots = ["UndergradKB.DifferentialEquations"]
globs = ["UndergradKB.DifferentialEquations.*"]

[[lean_lib]]
name = "ComplexAnalysis"
roots = ["UndergradKB.ComplexAnalysis"]
globs = ["UndergradKB.ComplexAnalysis.*"]

[[lean_lib]]
name = "RepresentationTheory"
roots = ["UndergradKB.RepresentationTheory"]
globs = ["UndergradKB.RepresentationTheory.*"]

[[lean_lib]]
name = "Topology"
roots = ["UndergradKB.Topology"]
globs = ["UndergradKB.Topology.*"]

[[lean_lib]]
name = "RealAnalysis"
roots = ["UndergradKB.RealAnalysis"]
globs = ["UndergradKB.RealAnalysis.*"]

# One headline check per topic: Challenge_<Topic> states the headline results (proofs: deliberate sorry),
# Solution_<Topic> proves them from the library; each imports only the modules of its own topic it needs.
[[lean_lib]]
