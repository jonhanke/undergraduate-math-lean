name: build

# Copied from elementary-number-theory-lean v0.1.0 (.github/workflows/build.yml), itself from
# algebraic-number-theory-lean v0.1.0, with these changes: the library is split into one Lean library per topic,
# so the axioms and the names of the book maps are checked one topic at a time (each check imports one topic only),
# the import rules are checked first (scripts/check_modularity.py), and lake comparator runs once per topic
# (Challenge_<Topic> against Solution_<Topic>), as a matrix of jobs after the build, so that no single check has to
# load the statements of every topic.

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space (the library build and the comparator exports need it)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      # Actions pinned to the commits used by PalomarRegistry/PalomarTemplate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check the import rules (no file imports all of Mathlib; topics never import each other)
        run: python3 scripts/check_modularity.py

      - name: Add swap space (the build needs more than the runner's 16 GB of memory)
        run: |
          # the runner already has a small /swapfile in use: switch it off and replace it
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # Our own cache around the build (not lean-action's): its save step runs only after a finished build, so a
      # run stopped by GitHub's 6-hour limit would bank nothing and every later run would start cold again.
      # Same key scheme as lean-action: toolchain + manifest + commit; fall back to the newest earlier build.
      - name: Restore the previous build
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Set up Lean and the Mathlib cache (no build yet)
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          use-mathlib-cache: true
          use-github-cache: false
          build: false

      # Time-boxed so that the save below always gets to run: if the build is cut off, re-run the workflow and it
      # continues from the saved files.
      - name: Build
        id: build
        timeout-minutes: 320
        continue-on-error: true
        run: lake build

      - name: Save the build (also after a cut-off build)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stop if the build did not finish
        if: steps.build.outcome != 'success'
        run: |
          echo "The build did not finish (failed or cut off at 5 h 20 min). Its progress is saved: re-run this workflow to continue."
          exit 1

      - name: Check the axioms of the headline theorems (one topic at a time)
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/check_axioms/*.lean; do
            echo "== $f"
            lake env lean "$f" | tee axioms.txt
            # Each headline must be reported, and depend only on the three standard axioms.
            count=$(grep -c "depends on axioms" axioms.txt || true)
            expected=$(grep -c "^#print axioms" "$f")
            if [ "$count" -ne "$expected" ]; then
              echo "expected $expected axiom reports, got $count"; exit 1
            fi
            if grep -q "sorryAx" axioms.txt; then
              echo "a headline theorem depends on sorryAx"; exit 1
            fi
            # Output may wrap an axiom list over several lines: join, then read every [ ... ] list.
            bad=$(tr '\n' ' ' < axioms.txt | grep -o 'depends on axioms: \[[^]]*\]' \
              | sed -E 's/.*\[(.*)\]/\1/' | tr ',' '\n' | sed 's/ //g' \
              | grep -vxE 'propext|Classical\.choice|Quot\.sound' || true)
            if [ -n "$bad" ]; then
              echo "non-standard axioms: $bad"; exit 1
            fi
          done
          echo "all headline theorems use only propext, Classical.choice, Quot.sound"

      - name: Check that the Lean names of the book maps exist (one topic at a time)
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/check_map_names/*.lean; do
            echo "== $f"
            lake env lean "$f" > /dev/null
          done

  comparator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        topic: [LinearAlgebra, AbstractAlgebra, Combinatorics, Calculus, Trigonometry, Geometry]
    steps:
      - name: Free disk space (the comparator exports need it)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Add swap space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # The build job saved its finished build under a key that begins with this commit's prefix.
      - name: Restore the build of this commit
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}-

      - name: Set up Lean and the Mathlib cache (no build yet)
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          use-mathlib-cache: true
          use-github-cache: false
          build: false

      - name: Build the challenge and solution of this topic (already built by the build job)
        run: lake build Challenge_${{ matrix.topic }} Solution_${{ matrix.topic }}

      - name: Install bubblewrap for lake comparator's sandbox
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          # As in the Palomar template: Ubuntu 24.04 blocks unprivileged user namespaces,
          # which bubblewrap needs. This affects only the throwaway CI runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check Solution_${{ matrix.topic }} against Challenge_${{ matrix.topic }} with lake comparator
        run: ./scripts/verify-comparator.sh ${{ matrix.topic }}
